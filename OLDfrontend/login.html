<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="styles/page.css" />
    <link rel="stylesheet" href="styles/user.css" />
  </head>

  <body>
    <header class="site-header">
      <h2 class="site-title">AutoVault</h2>
      <nav aria-label="Primary">
        <a href="list.html">Home</a>
        <a href="detail.html">Car Details</a>
        <a href="user.html">User Profile</a>
        <a class="nav-button" href="signup.html">Create account</a>
      </nav>
    </header>

    <main>
      <h1>Sign in to your account</h1>
      <p>Enter your details below to continue to your account.</p>

      <form action="list.html">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <div class="options">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <div class="form-footer">
          <span>Don't have an account? <a href="signup.html">Create one</a></span>
          <button type="submit">Sign in</button>
        </div>
      </form>
    </main>

    <footer>
      <span>&copy; AutoVault</span>
      <span>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </span>
    </footer>
  </body>
</html>
