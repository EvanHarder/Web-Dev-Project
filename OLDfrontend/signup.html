<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account</title>
    <link rel="stylesheet" href="styles/page.css" />
    <link rel="stylesheet" href="styles/user.css" />
  </head>

  <body>
    <header class="site-header">
      <h2 class="site-title">AutoVault</h2>
      <nav aria-label="Primary">
        <a href="list.html">Home</a>
        <a href="detail.html">Car Details</a>
        <a href="user.html">User Profile</a>
        <a class="nav-button" href="login.html">Sign in</a>
      </nav>
    </header>

    <main class="wide">
      <h1>Start your account</h1>
      <p>Enter your details below to create your profile. All fields are required.</p>

      <form action="list.html">
        <div class="field-row">
          <div class="field">
            <label for="first-name">First name</label>
            <input type="text" id="first-name" placeholder="Enter first name" required />
          </div>
          <div class="field">
            <label for="last-name">Last name</label>
            <input type="text" id="last-name" placeholder="Enter last name" required />
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>

        <div class="field half">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required />
        </div>

        <div class="form-footer">
          <span>Already have an account? <a href="login.html">Sign in</a></span>
          <button type="submit">Create account</button>
        </div>
      </form>
    </main>

    <footer>
      <span>&copy; AutoVault</span>
      <span>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </span>
    </footer>
  </body>
</html>
