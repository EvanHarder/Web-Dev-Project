<!DOCTYPE html>

  <head>

    <title>AutoVault</title>

  <header class="site-header">
        <div class="site-title">AutoVault</div>
        <nav aria-label="Primary">
            <a href="list.html">Home</a>

        </nav>

  <main id="main-content">
    <div class="page">

      <!-- Catalog View -->
      <section class="catalog-view">
        <div class="catalog-header-container">
          <!-- Search Bar -->
          <form class="search-bar">
            <input type="search" id="search-input" placeholder="Search by make, model, or year..." />
            <button type="submit" id="search-button">Search</button>
          </form>

          <h1 id="catalog-header" class="page-title">Vehicle Catalog</h1>

          <!-- Controls/Filters -->
          <div class="controls-container">
            <div class="controls-group">
              <select class="dropdown" name="filter-category" id="filter-category">
                <option value="">Brand</option>
                <option value="honda">Honda</option>
                <option value="toyota">Toyota</option>
                <option value="ford">Ford</option>
                <option value="...">...</option>
              </select>
              <span class="filter-count">Showing # vehicles</span>
            </div>

            <div class="controls-group">
              <select class="dropdown" name="sort-category" id="sort-category">
                <option value="">Sort by</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="...">...</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Vehicle List -->
        <div class="card-grid">
          <article class="card">
            <div class="card-media">
